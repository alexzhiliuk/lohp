<section class="clarity">
    <img src="img/practitioners/flower3-parallax.png" alt="" class="clarity__flower">
    <div class="clarity__content">
        <h2 class="clarity__title fade-in">Clarity doesn't come from having all the answers. It comes from seeing how it all connects.</h2>
        <div class="clarity__stats">
            <div class="clarity__stat">
                <span class="clarity__stat-number" data-target="1000" data-suffix="+">0</span>
                <span class="clarity__stat-label">Practitioners</span>
            </div>
            <div class="clarity__stat">
                <span class="clarity__stat-number" data-target="4.8" data-decimals="1">0</span>
                <span class="clarity__stat-label">Rating</span>
            </div>
            <div class="clarity__stat">
                <span class="clarity__stat-number" data-target="2.6" data-suffix="m+" data-decimals="1">0</span>
                <span class="clarity__stat-label">Sessions</span>
            </div>
            <div class="clarity__stat">
                <span class="clarity__stat-number" data-target="24" data-suffix="/7">0</span>
                <span class="clarity__stat-label">Available</span>
            </div>
        </div>
    </div>
    <div class="clarity__bottom">
        <div class="clarity__avatars">
            <img src="img/clarity/avatar1.jpg" alt="" class="clarity__avatar">
            <img src="img/clarity/avatar2.jpg" alt="" class="clarity__avatar">
            <img src="img/clarity/avatar3.jpg" alt="" class="clarity__avatar">
            <img src="img/clarity/avatar4.jpg" alt="" class="clarity__avatar">
        </div>
        <a href="#" class="btn btn--primary">BEGIN YOUR JOURNEY</a>
        <div class="clarity__press">
            <img src="img/clarity/yahoo.svg" alt="Yahoo!" class="clarity__press-logo">
            <img src="img/clarity/nyt.svg" alt="The New York Times" class="clarity__press-logo">
            <img src="img/clarity/slate.svg" alt="Slate" class="clarity__press-logo">
        </div>
    </div>
</section>
